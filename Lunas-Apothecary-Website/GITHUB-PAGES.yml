name: Publish Lunas Apothecary website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Prepare Luna website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, shutil
          from pathlib import Path
          from urllib.parse import urlsplit
          from xml.sax.saxutils import escape
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          u = urlsplit(base)
          if u.scheme != 'https' or not u.netloc or u.query or u.fragment or any(c in base for c in '<>"\' '):
              raise SystemExit('GitHub Pages hat keine gueltige HTTPS-Adresse geliefert. Settings > Pages > GitHub Actions pruefen.')
          candidates = []
          for marker in Path('.').rglob('luna-site.json'):
              if any(part in {'.git', '_site', 'node_modules'} for part in marker.parts):
                  continue
              if json.loads(marker.read_text(encoding='utf-8')).get('appId') == '6802070602':
                  candidates.append(marker.parent)
          if len(candidates) != 1:
              raise SystemExit('Bitte genau einen vollstaendigen Website-Ordner inklusive luna-site.json hochladen. Gefunden: '+str(len(candidates)))
          source = candidates[0]
          required = ['index.html', 'datenschutz.html', '404.html', 'styles.css', 'assets/icon.jpg'] + [f'assets/screen-{i}.jpg' for i in range(1,6)]
          missing = [n for n in required if not (source/n).is_file()]
          if missing:
              raise SystemExit('Diese Website-Dateien fehlen: '+', '.join(missing))
          out = Path('_site')
          out.mkdir(exist_ok=True)
          for name in ['index.html', 'datenschutz.html', '404.html', 'styles.css']:
              shutil.copy2(source/name, out/name)
          shutil.copytree(source/'assets', out/'assets', dirs_exist_ok=True)
          for name in ['index.html', 'datenschutz.html']:
              page = out/name
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'<link rel="canonical"[^>]*>|<meta property="og:url"[^>]*>', '', text)
              url = base + ('' if name == 'index.html' else name)
              text = text.replace('</head>', f'<link rel="canonical" href="{url}"><meta property="og:url" content="{url}"></head>')
              page.write_text(text, encoding='utf-8')
          page = out/'404.html'
          page.write_text(re.sub(r'<a data-home href="[^"]*"', f'<a data-home href="{base}"', page.read_text(encoding='utf-8')), encoding='utf-8')
          (out/'sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+''.join('<url><loc>'+escape(base+n)+'</loc></url>' for n in ['', 'datenschutz.html'])+'</urlset>\n', encoding='utf-8')
          (out/'robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: '+base+'sitemap.xml\n', encoding='utf-8')
          (out/'.nojekyll').touch()
          print('Website bereit: '+str(source)+' -> '+base)
          PYTHON
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
